<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1.0">
	<link rel="stylesheet" type="text/css" href="./main.css"/>
	<script src="https://cdn.jsdelivr.net/npm/js-cookie@rc/dist/js.cookie.min.js"></script>
	<script src="https://cdn.polyfill.io/v3/polyfill.js?features=default,String.prototype.repeat,Array.prototype.find,Array.prototype.findIndex,Math.trunc,Math.sign,Object.is"></script>
	<script src="https://unpkg.com/spacetime"></script>
	<script src="/form.js"></script>
	<script src="/iana.js"></script>
</head>

<body>
	<h1 class="centerText">Settings</h1>

	<form id="settingsForm" action="" onsubmit="submitConfig()">
		<div id="tzPicker">
			<label>Select your location:</label>
			<br>
			<select id="landmass" name="landmass">
	
			</select>
			<br>
	
			<label>Select your timezone:</label>
			<br>
			<select id="timezone" name="timezone">
				
			</select>
		</div>

		<div id="timeFormat">
			<label>Select a time format:</label>
			<br>
			<select name="time_format">
				<option value="12" selected="selected">12 hour</option>
				<option value="24">24 hour</option>
			</select>
		</div>

		<br><br>

		<input type="submit" value="Save">
	</form>

	<div id="statusMessage" class="centerText" style="visibility: hidden">
		<p>configuration message</p>
	</div>

	<a href="/index.html" class="centerText">go back to main page</a>
	
</body>

<script>
	"use strict";

	function changeSelectionField(element, items) {
		element.innerHTML = ''
		for (var i = 0; i < items.length; i++) {
			var tempElm = document.createElement('option')
			tempElm.innerHTML = items[i]
			element.appendChild( tempElm )
		}
	}
	
	listLandmasses()
	function listLandmasses() {
		var landmassField = document.querySelector('#landmass')
		var landmasses = data_landmasses
		changeSelectionField(landmassField, landmasses)

		// click event listener only works if user taps outside of selection
		// mouseout is kind of a hack
		document.querySelector('#landmass').addEventListener('change',
			function(event) {
				listTimezones(event.target.value)
			}
		)
	}

	listTimezones('africa')
	function listTimezones(query) {
		console.log(query)
		var timezones = Object.keys(data_timezones).filter(function(k){ return ~k.indexOf( query ) })
		var timezoneField = document.querySelector('#timezone')
		changeSelectionField(timezoneField, timezones)
	}

	function submitConfig() {
		event.preventDefault()
		
		try {
			var formData = serialize(document.querySelector('#settingsForm'), {hash: true})
			Cookies.set('timeformat', formData.time_format)
			Cookies.set('timezone', formData.timezone)
			console.log(formData)

			document.querySelector('#statusMessage p').innerText = 'Config saved!'
		}
		catch (err) {
			console.log(err)
			document.querySelector('#statusMessage p').innerText = 'Config failed!'
		}
		finally {
			document.querySelector('#statusMessage').style.visibility = 'visible'
		}

		console.log('submitted!')
	}
</script>

<style>

	form {
		margin: 25px;
	}
	form > input[type="submit"] {
		width: 250px;
		display: block;
		margin-left: auto;
		margin-right: auto;
		border: 2px solid black;
		background-color: gainsboro;
	}

	form select {
		width: 100%;
		font-size: 100%;
	}
</style>

</html>
