<script>
	// Kindle uses UTC time, prompt them to change their settings
	// if ( spacetime.now().timezone().name == 'Utc' ) {
	// 	document.querySelector('#statusMessage p').innerText = 'Your timezone is set to UTC, please change your timezone in the settings'
	// 	document.querySelector('#statusMessage').style.visibility = 'visible'
	// }

	function getTime() {
		var tz = Cookies.get('timezone')
		var tzHour = spacetime.now(tz).hour()
		var tzMin = spacetime.now(tz).minute()
		var tzSecond = spacetime.now(tz).second()

		var timeFormat = Cookies.get('timeformat')
	
		// converts to 12 hour time
		if (timeFormat == '12' && tzHour > 12) {
			tzHour += -12
		}

		return {
			hour: tzHour,
			minute: tzMin,
			second: tzSecond
		}
	}

	startTime()
	function startTime() {
		var currTime = getTime()
		document.getElementById('txt').innerHTML = currTime.hour + ":" + currTime.minute;
		var t = setTimeout(startTime, 1000 * 60); // not the most accurate time
	}
</script>
